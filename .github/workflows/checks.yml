name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and validate the installed package
        run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Store synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-crm-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Store the pre-production bundle
        if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: open-crm-preproduction-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
