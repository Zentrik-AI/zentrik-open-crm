name: Worktree Adapter

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/worktree-lifecycle.yml'
      - '.zentrik/worktree.json'
      - '.gitignore'
      - 'scripts/worktree-dev.mjs'
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/worktree-lifecycle.yml'
      - '.zentrik/worktree.json'
      - '.gitignore'
      - 'scripts/worktree-dev.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 adapter contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate entry points and profile
        run: |
          node --check scripts/worktree-dev.mjs
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('.zentrik/worktree.json','utf8')); if (p.defaultBase !== 'origin/develop') process.exit(1); if (!p.runtime?.profiles?.sandbox) process.exit(1);"

      - name: Validate the sandbox runtime
        run: |
          test -f node_modules/vite/bin/vite.js
          npm run typecheck
